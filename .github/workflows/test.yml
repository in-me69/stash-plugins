name: test
on:
  push:
  pull_request:
  # Lets the publish workflow run the tests before building.
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: sudo apt-get install -y --no-install-recommends ffmpeg || true
      - run: python -m unittest discover -s tests -v
