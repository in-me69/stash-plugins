; Optional. Copy to config.ini (next to FilenameParser.py) only if you want
; to change something. Anything left empty or missing uses the default.
; STASH_URL / STASH_API_KEY environment variables override [stash] below.

[stash]
; Leave both empty to reuse py_common's config.ini (CommunityScrapers) or
; Stash's own config.yml, which the scraper finds automatically.
; Set them if Stash runs elsewhere, e.g. url = http://nas.local:9999
url =
; Settings > Security > API Key.
api_key =

[parser]
; Tag added when a date in the filename can be read more than one way
; (e.g. 03.04.2023). Only the year is kept, or nothing if even the year is
; unclear. Leave empty to disable the tag.
review_tag = Date Needs Review

; Tag added when text in the path is an alias of several performers and
; nothing else says which one is meant (e.g. a folder "Gracie" that three
; performers have as an alias); none of them is added. Leave empty to
; disable the tag.
performer_review_tag = Performer Needs Review

; Two-digit-year dates like 23.04.15: "auto" treats them as ambiguous unless
; only one reading is valid; "ymd" always reads them as YY.MM.DD (the usual
; scene-release convention).
two_digit_year_order = auto

; "path" matches performers/studios/tags against the full path, like Auto Tag
; does (so a studio folder is picked up). "filename" ignores folder names.
match_scope = path

; Also match performers by their aliases (Auto Tag only uses primary
; names). Aliases shorter than 3 letters/digits are never matched alone.
match_performer_aliases = true

; Seconds to cache your performer/studio/tag lists between scrapes, so a
; batch Identify run doesn't fetch the whole library for every scene.
; 0 disables the cache.
cache_ttl_seconds = 300
