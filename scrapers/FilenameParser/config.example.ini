; Copy to config.ini (next to FilenameParser.py) and adjust.
; STASH_URL / STASH_API_KEY environment variables override [stash] below.

[stash]
url = http://localhost:9999
; Settings > Security > API Key. Leave empty if Stash has no login.
api_key =

[parser]
; Tag added when a date in the filename can be read more than one way
; (e.g. 03.04.2023). Only the year is kept, or nothing if even the year is
; unclear. Leave empty to disable the tag.
review_tag = Date Needs Review

; Two-digit-year dates like 23.04.15: "auto" treats them as ambiguous unless
; only one reading is valid; "ymd" always reads them as YY.MM.DD (the usual
; scene-release convention).
two_digit_year_order = auto

; "path" matches performers/studios/tags against the full path, like Auto Tag
; does (so a studio folder is picked up). "filename" ignores folder names.
match_scope = path

; Seconds to cache your performer/studio/tag lists between scrapes, so a
; batch Identify run doesn't fetch the whole library for every scene.
; 0 disables the cache.
cache_ttl_seconds = 300
